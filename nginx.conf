# Nginx configuration for Nexus — Agentic RAG (static single-page app)
# Usage:
#   1. Copy the app files to /usr/share/nginx/html (or change `root` below)
#   2. Place this file at /etc/nginx/conf.d/nexus.conf  (or /etc/nginx/sites-available/)
#   3. nginx -t && systemctl reload nginx
#
# Docker example:
#   docker run -d -p 80:80 \
#     -v $(pwd):/usr/share/nginx/html:ro \
#     -v $(pwd)/nginx.conf:/etc/nginx/conf.d/default.conf:ro nginx:alpine

# Redirect HTTP -> HTTPS (enable once you have a certificate)
# server {
#     listen 80;
#     listen [::]:80;
#     server_name nexus.example.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    listen [::]:80;
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    server_name _;                       # replace with your domain, e.g. nexus.example.com

    # ssl_certificate     /etc/letsencrypt/live/nexus.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/nexus.example.com/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    client_max_body_size 25m;           # matches the 25 MB upload limit in the app

    # ---------- Compression ----------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/manifest+json image/svg+xml;

    # ---------- Security headers ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Puter sign-in uses a popup window; keep opener access for it.
    add_header Cross-Origin-Opener-Policy "unsafe-none" always;

    # ---------- JS modules must be served with a JS MIME type ----------
    location ~* \.m?js$ {
        types { application/javascript js mjs; }
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---------- Static assets: long cache ----------
    location ~* \.(css|svg|png|jpg|jpeg|gif|webp|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ---------- HTML: never cache so updates show immediately ----------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---------- SPA fallback (/login, /signup, /chat/... -> index.html) ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- Optional: proxy to an Express/Node API (MERN backend) ----------
    # location /api/ {
    #     proxy_pass         http://127.0.0.1:5000;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Upgrade $http_upgrade;
    #     proxy_set_header   Connection "upgrade";
    #     proxy_set_header   Host $host;
    #     proxy_set_header   X-Real-IP $remote_addr;
    #     proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 120s;          # agent runs can take a while
    # }

    # Block hidden files (.git, .env, ...)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.html;
}
